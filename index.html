<!DOCTYPE html><html lang="ru" data-accent="gold" data-slab="sky"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Юлия Шабашова — обучение работе с ИИ для бизнеса и экспертов</title>
<meta name="description" content="Учу предпринимателей, руководителей и экспертов работать с нейросетями спокойно и на понятном языке. Курсы от 990 ₽, консультации, выступления.">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="landing.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="ds-bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="app.js"></script>
<script type="text/babel">
function Site(){
  const { Toast, ToastStack } = window.SHBSHVAIDesignSystem_3ba733;
  const [sent,setSent]=React.useState(false);
  const [toast,setToast]=React.useState(false);
  useReveal(); useTactile();
  React.useEffect(()=>{
    const id=(window.location.hash||'').replace('#','');
    if(!id) return;
    let n=0;
    const t=setInterval(()=>{
      const el=document.getElementById(id);
      if(el){ window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-96,behavior:'auto'}); clearInterval(t); }
      if(++n>40) clearInterval(t);
    },60);
    return ()=>clearInterval(t);
  },[]);
  const nav=(id)=>{
    if(id==='top'){window.scrollTo({top:0,behavior:'smooth'});return;}
    const el=document.getElementById(id);
    if(el){window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-96,behavior:'smooth'});}
  };
  const lead=()=>nav('lead');
  const submit=()=>{setSent(true);setToast(true);setTimeout(()=>setToast(false),4500);};
  return (<>
    <Atmosphere/>
    <LandingHeader onNav={nav} onLead={lead}/>
    <Rail onNav={nav}/>
    <HeroSection onLead={lead} onNav={nav}/>
    <AudienceSection/>
    <AboutSection/>
    <ResultsSection/>
    <OfferSection onLead={lead}/>
    <CasesTeaser/>
    <ReviewsSection/>
    <LeadSection sent={sent} onSubmit={submit}/>
    <FaqSection onLead={lead}/>
    <LandingFooter onNav={nav}/>
    <ToastStack position="br">{toast && <Toast tone="positive" title="Запись отправлена" onClose={()=>setToast(false)}>Письмо придёт в течение пары минут.</Toast>}</ToastStack>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script></body></html>
